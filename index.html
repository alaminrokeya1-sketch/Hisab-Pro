<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f4c3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hisab Pro - হিসাব প্রো</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #e5e7eb; margin: 0; padding: 0; overscroll-behavior-y: contain; }
    .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #f8fafc; position: relative; padding-bottom: 76px; box-shadow: 0 0 25px rgba(0,0,0,0.08); }
    .header-bg { background: linear-gradient(135deg, #0f4c3a 0%, #16654e 100%); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .calc-btn { transition: transform 0.06s, background-color 0.1s; user-select: none; }
    .calc-btn:active { transform: scale(0.95); background-color: #e2e8f0; }
  </style>
</head>
<body>

<div class="app-shell" id="app">
  <!-- Top Mode Switcher Bar -->
  <div class="header-bg text-white px-4 pt-3 pb-2 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <!-- Custom SVG Logo (Without Taka Symbol) -->
      <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center border border-white/25">
        <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <span class="font-bold text-lg tracking-wide">Hisab Pro</span>
    </div>
    <div class="bg-black/25 p-1 rounded-full flex text-xs font-semibold">
      <button onclick="switchMode('shop')" id="modeBtnShop" class="px-3 py-1 rounded-full bg-white text-emerald-900 transition">দোকান</button>
      <button onclick="switchMode('personal')" id="modeBtnPersonal" class="px-3 py-1 rounded-full text-white/90 transition">ব্যক্তিগত</button>
    </div>
  </div>

  <!-- Dynamic Main Content -->
  <div id="mainContent"></div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-30 shadow-lg">
    <button onclick="navigate('home')" class="nav-item flex flex-col items-center text-emerald-800 font-semibold text-xs" data-tab="home">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>হোম</span>
    </button>
    <button onclick="navigate('cashbox')" id="navCashbox" class="nav-item flex flex-col items-center text-slate-500 font-medium text-xs" data-tab="cashbox">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span>ক্যাশবাক্স</span>
    </button>
    <button onclick="navigate('reports')" class="nav-item flex flex-col items-center text-slate-500 font-medium text-xs" data-tab="reports">
      <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>রিপোর্ট</span>
    </button>
  </nav>
</div>

<!-- In-App Calculator Drawer Modal -->
<div id="calcModal" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-end max-w-[480px] mx-auto">
  <div class="bg-white rounded-t-2xl p-4 shadow-2xl">
    <div class="flex justify-between items-center mb-2">
      <span id="calcTitle" class="font-bold text-slate-800 text-base">লেনদেন যোগ করুন</span>
      <button onclick="closeCalc()" class="text-slate-400 hover:text-slate-700 text-xl font-bold px-2">&times;</button>
    </div>

    <!-- Note & Date Inputs -->
    <div class="grid grid-cols-2 gap-2 mb-2">
      <input type="text" id="calcNote" placeholder="বিবরণ লিখুন (যেমন: নগদ / বাকি)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-700" />
      <input type="date" id="calcDate" class="border border-slate-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-emerald-700" />
    </div>

    <!-- Category Selector (Only for Personal Mode) -->
    <div id="calcCategoryWrap" class="mb-2 hidden">
      <select id="calcCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select>
    </div>

    <!-- Calculator Display -->
    <div class="bg-slate-100 border border-slate-300 rounded-xl px-3 py-2.5 mb-3 flex justify-between items-center">
      <span class="text-xs text-slate-500 font-medium" id="calcExpr">0</span>
      <span class="text-2xl font-bold text-emerald-900">৳ <span id="calcDisplay">0</span></span>
    </div>

    <!-- Custom Calculator Keypad -->
    <div class="grid grid-cols-4 gap-2 mb-3 text-lg font-bold text-slate-800">
      <button onclick="pressCalc('7')" class="calc-btn bg-slate-100 py-3 rounded-xl">7</button>
      <button onclick="pressCalc('8')" class="calc-btn bg-slate-100 py-3 rounded-xl">8</button>
      <button onclick="pressCalc('9')" class="calc-btn bg-slate-100 py-3 rounded-xl">9</button>
      <button onclick="pressCalc('C')" class="calc-btn bg-rose-100 text-rose-700 py-3 rounded-xl">C</button>

      <button onclick="pressCalc('4')" class="calc-btn bg-slate-100 py-3 rounded-xl">4</button>
      <button onclick="pressCalc('5')" class="calc-btn bg-slate-100 py-3 rounded-xl">5</button>
      <button onclick="pressCalc('6')" class="calc-btn bg-slate-100 py-3 rounded-xl">6</button>
      <button onclick="pressCalc('+')" class="calc-btn bg-emerald-100 text-emerald-800 py-3 rounded-xl">+</button>

      <button onclick="pressCalc('1')" class="calc-btn bg-slate-100 py-3 rounded-xl">1</button>
      <button onclick="pressCalc('2')" class="calc-btn bg-slate-100 py-3 rounded-xl">2</button>
      <button onclick="pressCalc('3')" class="calc-btn bg-slate-100 py-3 rounded-xl">3</button>
      <button onclick="pressCalc('-')" class="calc-btn bg-emerald-100 text-emerald-800 py-3 rounded-xl">-</button>

      <button onclick="pressCalc('0')" class="calc-btn bg-slate-100 py-3 rounded-xl">0</button>
      <button onclick="pressCalc('00')" class="calc-btn bg-slate-100 py-3 rounded-xl">00</button>
      <button onclick="pressCalc('.')" class="calc-btn bg-slate-100 py-3 rounded-xl">.</button>
      <button onclick="pressCalc('=')" class="calc-btn bg-emerald-700 text-white py-3 rounded-xl">=</button>
    </div>

    <!-- Action Buttons -->
    <div id="calcActions" class="grid grid-cols-2 gap-2"></div>
  </div>
</div>

<!-- Add Party / Shop / House / Category Modal -->
<div id="promptModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 max-w-[480px] mx-auto">
  <div class="bg-white rounded-2xl p-5 w-full shadow-xl">
    <h3 id="promptTitle" class="font-bold text-lg text-slate-800 mb-3">নতুন তথ্য যোগ করুন</h3>
    <div id="promptFields" class="space-y-3 mb-4"></div>
    <div class="flex justify-end gap-2">
      <button onclick="closePrompt()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-semibold text-sm">বাতিল</button>
      <button id="promptSaveBtn" class="px-4 py-2 rounded-lg bg-emerald-800 text-white font-semibold text-sm">সেভ করুন</button>
    </div>
  </div>
</div>

<script>
  const todayStr = () => new Date().toISOString().split('T')[0];

  const defaultData = {
    mode: 'shop',
    activeTab: 'home',
    selectedShopId: 'shop1',
    selectedHouseId: 'house1',
    shopTab: 'customer',
    selectedPartyId: null,
    shops: [
      { id: 'shop1', name: 'বিসমিল্লাহ স্টোর', openingCash: 5000 }
    ],
    parties: [
      { id: 'p1', shopId: 'shop1', type: 'customer', name: 'রহিম উদ্দিন', phone: '01711234567' },
      { id: 'p2', shopId: 'shop1', type: 'supplier', name: 'করিম ট্রেডার্স', phone: '01999887766' }
    ],
    shopTxns: [
      { id: 't1', shopId: 'shop1', partyId: 'p1', kind: 'given', amount: 5400, note: 'বাকিতে মাল বিক্রয়', date: todayStr() },
      { id: 't2', shopId: 'shop1', partyId: 'p2', kind: 'received', amount: 2100, note: 'মাল ক্রয় বাকি', date: todayStr() }
    ],
    cashTxns: [
      { id: 'c1', shopId: 'shop1', type: 'in', amount: 10000, note: 'নগদ বিক্রয়', date: todayStr() },
      { id: 'c2', shopId: 'shop1', type: 'out', amount: 2000, note: 'দোকান খরচ', date: todayStr() }
    ],
    salesClosings: [],
    houses: [
      { id: 'house1', name: 'বাড়ি ১' }
    ],
    personalCategories: ['বাজার', 'বাসা ভাড়া', 'বিদ্যুৎ বিল', 'চিকিৎসা', 'অন্যান্য'],
    selectedCategories: [],
    personalTxns: [
      { id: 'pt1', houseId: 'house1', type: 'income', category: 'অন্যান্য', amount: 45000, note: 'মাসিক আয়', date: todayStr() },
      { id: 'pt2', houseId: 'house1', type: 'expense', category: 'বাজার', amount: 2500, note: 'সাপ্তাহিক বাজার', date: todayStr() }
    ]
  };

  let state = JSON.parse(localStorage.getItem('hisabProState')) || defaultData;
  const saveState = () => localStorage.setItem('hisabProState', JSON.stringify(state));

  function switchMode(mode) {
    state.mode = mode;
    state.selectedPartyId = null;
    state.activeTab = 'home';
    saveState();
    render();
  }

  function navigate(tab) {
    state.activeTab = tab;
    state.selectedPartyId = null;
    saveState();
    render();
  }

  function render() {
    document.getElementById('modeBtnShop').className = state.mode === 'shop'
      ? 'px-3 py-1 rounded-full bg-white text-emerald-900 transition shadow-sm'
      : 'px-3 py-1 rounded-full text-white/90 transition';
    document.getElementById('modeBtnPersonal').className = state.mode === 'personal'
      ? 'px-3 py-1 rounded-full bg-white text-emerald-900 transition shadow-sm'
      : 'px-3 py-1 rounded-full text-white/90 transition';

    document.getElementById('navCashbox').style.display = state.mode === 'shop' ? 'flex' : 'none';

    document.querySelectorAll('.nav-item').forEach(btn => {
      const active = btn.dataset.tab === state.activeTab;
      btn.className = `nav-item flex flex-col items-center text-xs ${active ? 'text-emerald-800 font-bold' : 'text-slate-500 font-medium'}`;
    });

    const container = document.getElementById('mainContent');
    if (state.mode === 'shop') {
      if (state.selectedPartyId) {
        container.innerHTML = renderPartyProfile();
      } else if (state.activeTab === 'home') {
        container.innerHTML = renderShopHome();
      } else if (state.activeTab === 'cashbox') {
        container.innerHTML = renderCashbox();
      } else {
        container.innerHTML = renderReports();
      }
    } else {
      if (state.activeTab === 'home') {
        container.innerHTML = renderPersonalHome();
      } else {
        container.innerHTML = renderReports();
      }
    }
  }

  function renderShopHome() {
    const shop = state.shops.find(s => s.id === state.selectedShopId) || state.shops[0];
    const shopTxns = state.shopTxns.filter(t => t.shopId === shop.id);
    const parties = state.parties.filter(p => p.shopId === shop.id);

    let totalPabo = 0, totalDebo = 0, todayBakiGiven = 0, todayBakiGot = 0;
    parties.forEach(p => {
      const pTxns = shopTxns.filter(t => t.partyId === p.id);
      const bal = pTxns.reduce((acc, t) => acc + (t.kind === 'given' ? t.amount : -t.amount), 0);
      if (bal > 0) totalPabo += bal;
      if (bal < 0) totalDebo += Math.abs(bal);
    });

    const today = todayStr();
    shopTxns.filter(t => t.date === today).forEach(t => {
      if (t.kind === 'given') todayBakiGiven += t.amount;
      if (t.kind === 'received') todayBakiGot += t.amount;
    });
    const todayNetBaki = todayBakiGiven - todayBakiGot;

    const filteredParties = parties.filter(p => p.type === state.shopTab);

    return `
      <div class="header-bg text-white px-4 pt-2 pb-6 rounded-b-3xl shadow-md">
        <div class="flex justify-between items-center mb-4">
          <select onchange="changeShop(this.value)" class="bg-white/15 border border-white/25 text-white font-bold text-base rounded-xl px-3 py-1.5 focus:outline-none">
            ${state.shops.map(s => `<option value="${s.id}" class="text-slate-900" ${s.id === shop.id ? 'selected' : ''}>${s.name}</option>`).join('')}
          </select>
          <button onclick="openAddShopModal()" class="bg-emerald-600/80 border border-white/30 text-white text-xs font-semibold px-3 py-1.5 rounded-xl">+ নতুন দোকান</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-white text-slate-800 rounded-2xl p-3 text-center shadow">
            <div class="text-xs text-slate-500 font-semibold">পাবো (মোট)</div>
            <div class="text-xl font-bold text-emerald-700 mt-0.5">৳ ${totalPabo.toLocaleString()}</div>
          </div>
          <div class="bg-white text-slate-800 rounded-2xl p-3 text-center shadow">
            <div class="text-xs text-slate-500 font-semibold">দেবো (মোট)</div>
            <div class="text-xl font-bold text-rose-600 mt-0.5">৳ ${totalDebo.toLocaleString()}</div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-2.5 grid grid-cols-3 divide-x divide-slate-200 text-center shadow">
          <div>
            <div class="text-[11px] text-slate-500 font-semibold">আজকের বাকি</div>
            <div class="text-sm font-bold text-rose-600">৳ ${todayNetBaki.toLocaleString()}</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-500 font-semibold">বাকি পেলাম</div>
            <div class="text-sm font-bold text-emerald-700">৳ ${todayBakiGot.toLocaleString()}</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-500 font-semibold">বাকি দিলাম</div>
            <div class="text-sm font-bold text-amber-600">৳ ${todayBakiGiven.toLocaleString()}</div>
          </div>
        </div>
      </div>

      <div class="px-4 mt-4">
        <div class="bg-slate-200 p-1 rounded-xl grid grid-cols-2 text-sm font-bold mb-3">
          <button onclick="setShopTab('customer')" class="py-2 rounded-lg transition ${state.shopTab === 'customer' ? 'bg-white text-emerald-900 shadow-sm' : 'text-slate-600'}">কাস্টমার খাতা</button>
          <button onclick="setShopTab('supplier')" class="py-2 rounded-lg transition ${state.shopTab === 'supplier' ? 'bg-white text-emerald-900 shadow-sm' : 'text-slate-600'}">সাপ্লায়ার খাতা</button>
        </div>

        <div class="space-y-2.5 mb-20">
          ${filteredParties.length === 0 ? `<div class="text-center text-slate-400 py-8 text-sm">কোনো তালিকা পাওয়া যায়নি</div>` : ''}
          ${filteredParties.map(p => {
            const pTxns = shopTxns.filter(t => t.partyId === p.id);
            const bal = pTxns.reduce((acc, t) => acc + (t.kind === 'given' ? t.amount : -t.amount), 0);
            const lastDate = pTxns.length ? pTxns[pTxns.length - 1].date : 'নতুন';
            return `
              <div onclick="openParty('${p.id}')" class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer active:bg-slate-50">
                <div>
                  <div class="font-bold text-slate-800 text-base">${p.name}</div>
                  <div class="text-xs text-slate-400">${p.phone} • ${lastDate}</div>
                </div>
                <div class="text-right">
                  <div class="font-bold text-base ${bal >= 0 ? 'text-emerald-700' : 'text-rose-600'}">৳ ${Math.abs(bal).toLocaleString()}</div>
                  <div class="text-[11px] font-semibold ${bal >= 0 ? 'text-emerald-600' : 'text-rose-500'}">${bal >= 0 ? 'পাবো' : 'দেবো'}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="fixed bottom-16 left-0 right-0 max-w-[480px] mx-auto px-4 pointer-events-none">
          <button onclick="openAddPartyModal()" class="pointer-events-auto w-full bg-emerald-800 text-white font-bold py-3 rounded-2xl shadow-lg flex items-center justify-center gap-2">
            <span class="text-xl leading-none">+</span> কাস্টমার / সাপ্লায়ার যোগ করুন
          </button>
        </div>
      </div>
    `;
  }

  function renderPartyProfile() {
    const party = state.parties.find(p => p.id === state.selectedPartyId);
    const txns = state.shopTxns.filter(t => t.partyId === party.id);
    const filterFrom = document.getElementById('waFilterFrom')?.value || '';
    const filterTo = document.getElementById('waFilterTo')?.value || '';

    let running = 0;
    const txnsWithBal = txns.map(t => {
      running += (t.kind === 'given' ? t.amount : -t.amount);
      return { ...t, balanceAfter: running };
    });

    const netBal = running;

    return `
      <div class="header-bg text-white px-4 pt-3 pb-5 rounded-b-3xl shadow">
        <div class="flex items-center justify-between mb-3">
          <button onclick="navigate('home')" class="flex items-center gap-1 text-sm font-semibold bg-white/15 px-3 py-1 rounded-lg">← ফিরে যান</button>
          <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full">${party.type === 'customer' ? 'কাস্টমার' : 'সাপ্লায়ার'}</span>
        </div>
        <div class="flex justify-between items-end">
          <div>
            <h2 class="text-xl font-bold">${party.name}</h2>
            <p class="text-xs text-emerald-200">${party.phone}</p>
          </div>
          <div class="text-right bg-white/15 px-3 py-1.5 rounded-xl">
            <div class="text-[11px] text-emerald-100">${netBal >= 0 ? 'মোট পাবো' : 'মোট দেবো'}</div>
            <div class="text-lg font-bold">৳ ${Math.abs(netBal).toLocaleString()}</div>
          </div>
        </div>
      </div>

      <div class="p-4 space-y-3">
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-xs font-bold text-slate-600 mb-2">তারিখ ফিল্টার করে হিসাব পাঠান:</div>
          <div class="grid grid-cols-2 gap-2 mb-2.5">
            <input type="date" id="waFilterFrom" value="${filterFrom}" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs" />
            <input type="date" id="waFilterTo" value="${filterTo}" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="sendWhatsAppStatement('${party.id}')" class="bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm">
              WhatsApp পাঠান
            </button>
            <button onclick="sendDirectSMS('${party.id}', ${netBal})" class="bg-sky-600 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm">
              SMS তাগাদা
            </button>
          </div>
        </div>

        <div class="space-y-2 pb-20">
          ${txnsWithBal.slice().reverse().map(t => `
            <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
              <div>
                <div class="font-bold text-slate-800 text-sm">${t.note || (t.kind === 'given' ? 'দিলাম' : 'পেলাম')}</div>
                <div class="text-[11px] text-slate-400">${t.date}</div>
              </div>
              <div class="text-right">
                <div class="font-bold text-sm ${t.kind === 'given' ? 'text-rose-600' : 'text-emerald-700'}">
                  ৳ ${t.amount.toLocaleString()} (${t.kind === 'given' ? 'দিলাম' : 'পেলাম'})
                </div>
                <div class="text-[11px] text-slate-500">ব্যালেন্স: ৳ ${t.balanceAfter.toLocaleString()}</div>

  function calcNightlySales() {
    const shop = state.shops.find(s => s.id === state.selectedShopId) || state.shops[0];
    const today = todayStr();
    const closingCash = parseFloat(document.getElementById('closingCashInput').value) || 0;
    const bankDeposit = parseFloat(document.getElementById('bankDepositInput').value) || 0;

    const todayCashOut = state.cashTxns.filter(c => c.shopId === shop.id && c.date === today && c.type === 'out').reduce((s, c) => s + c.amount, 0);
    const shopTxnsToday = state.shopTxns.filter(t => t.shopId === shop.id && t.date === today);
    const todayDueCollected = shopTxnsToday.filter(t => t.kind === 'received').reduce((s, t) => s + t.amount, 0);
    const todayNewDue = shopTxnsToday.filter(t => t.kind === 'given').reduce((s, t) => s + t.amount, 0);

    const totalSales = (closingCash + bankDeposit + todayCashOut + todayNewDue) - ((shop.openingCash || 0) + todayDueCollected);
    document.getElementById('calculatedSalesDisplay').innerText = `৳ ${totalSales.toLocaleString()}`;
  }

  function saveNightlyClosing(opening, dueCol, newDue, expense) {
    const closingCash = parseFloat(document.getElementById('closingCashInput').value);
    if (isNaN(closingCash)) return alert('রাতে ক্যাশবাক্সে মোট টাকার পরিমাণ লিখুন');
    const bankDeposit = parseFloat(document.getElementById('bankDepositInput').value) || 0;
    const totalSales = (closingCash + bankDeposit + expense + newDue) - (opening + dueCol);

    const shop = state.shops.find(s => s.id === state.selectedShopId) || state.shops[0];
    shop.openingCash = closingCash;
    state.salesClosings.push({ id: Date.now().toString(), shopId: shop.id, date: todayStr(), totalSales, closingCash, bankDeposit });
    saveState();
    alert(`আজকের মোট বিক্রি ৳ ${totalSales.toLocaleString()} সেভ হয়েছে এবং আগামীকালের শুরু ক্যাশ হিসেবে ৳ ${closingCash.toLocaleString()} সেট করা হয়েছে।`);
    render();
  }

    const party = state.parties.find(p => p.id === partyId);
    const from = document.getElementById('waFilterFrom').value;

    let txns = state.shopTxns.filter(t => t.partyId === partyId);

    let msg = `*Hisab Pro - লেনদেনের হিসাব*\nনাম: ${party.name}\n`;
    txns.forEach(t => {
      msg += `${t.date}: ${t.kind === 'given' ? 'দিলাম' : 'পেলাম'} ৳${t.amount} (${t.note || ''})\n`;
    });
    const cleanPhone = party.phone.replace(/[^0-9]/g, '');
    const waPhone = cleanPhone.startsWith('88') ? cleanPhone : '88' + cleanPhone;
    window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`, '_blank');

  function closeCalc() {
    document.getElementById('calcModal').classList.add('hidden');
    document.getElementById('calcModal').classList.remove('flex');
  }

  function pressCalc(val) {
    if (val === 'C') {
      calcStr = '';
      document.getElementById('calcExpr').innerText = '0';
      document.getElementById('calcDisplay').innerText = '0';
      return;
    }
    if (val === '=') {
      try {
        const res = Function('"use strict";return (' + calcStr + ')')();
        calcStr = String(res);
        document.getElementById('calcDisplay').innerText = res;
      } catch {
        document.getElementById('calcDisplay').innerText = 'Error';
      }
      return;
    }
    calcStr += val;
    document.getElementById('calcExpr').innerText = calcStr;
    try {
      const res = Function('"use strict";return (' + calcStr + ')')();
      if (!isNaN(res)) document.getElementById('calcDisplay').innerText = res;
    } catch {}
  }

  function getCalcAmount() {
    try {
      return parseFloat(Function('"use strict";return (' + (calcStr || '0') + ')')()) || 0;
    } catch {
      return 0;
    }
  }

      if (!name) return;
      if (!state.personalCategories.includes(name)) state.personalCategories.push(name);
      saveState(); closePrompt(); render();
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
</script>
</body>
</html>
